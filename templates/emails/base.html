<!-- ============================================================
     *** EMAIL BASE TEMPLATE ***
     ============================================================ -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ subject }}</title>
    <!-- ============================================================
         *** EMAIL BASE: Meta Information ***
         ============================================================ -->
    <meta name="description"
          content="{{ subject }} | Notification from {{ site_name }}" />
    <meta name="keywords"
          content="Game Abyss, notifications, account, updates, alerts" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <!-- CSS is applied from static/css/email.css during delivery -->
  </head>
  <body class="comp-email comp-email--dark">
    <table role="presentation"
           class="comp-email__frame"
           cellpadding="0"
           cellspacing="0"
           width="100%">
      <tr>
        <td class="comp-email__wrapper" align="center">
          <table role="presentation"
                 class="comp-email__outer"
                 cellpadding="0"
                 cellspacing="0"
                 width="100%">
            <tr>
              <td class="comp-email__container">
                <!-- ============================================================
                     *** EMAIL BASE: Brand Section ***
                     ============================================================ -->
                <table role="presentation" class="comp-email__brand" align="center">
                  <tr>
                    <td align="center">
                      <div class="comp-email__brand-name">{{ site_name }}</div>
                      <div class="comp-email__brand-tagline">Signals from the Abyss</div>
                    </td>
                  </tr>
                </table>
                <!-- ============================================================
                     *** EMAIL BASE: Main Content Section ***
                     ============================================================ -->
                <table role="presentation" class="comp-email__content" width="100%">
                  <tr>
                    <td class="comp-email__content-inner">
                      {% block content %}
                      {% endblock content %}
                    </td>
                  </tr>
                </table>
                <!-- ============================================================
                     *** EMAIL BASE: Footer Section ***
                     ============================================================ -->
                <table role="presentation" class="comp-email__footer" align="center">
                  <tr>
                    <td class="comp-email__support">
                      <p>
                        Need a hand? Reach the council at
                        <a href="mailto:{{ support_email }}" class="comp-email__link">{{ support_email }}</a>
                      </p>
                      {% if site_url %}
                        <p class="comp-email__visit">
                          <a href="{{ site_url }}"
                             class="comp-email__link comp-email__link--muted">Visit {{ site_name }}</a>
                        </p>
                      {% endif %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!-- ============================================================
               *** EMAIL BASE: Legal Notice ***
               ============================================================ -->
          <p class="comp-email__legal">© {{ current_year }} {{ site_name }}. All transmissions reserved.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
