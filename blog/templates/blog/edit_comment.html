<!--
/* ============================================================
   *** BLOG TEMPLATE: Edit Comment Page ***
   ============================================================ */
-->
{% extends "base.html" %}
{% load static datetime_extras %}
{% block title %}
  Edit Comment · Game Abyss
{% endblock title %}
{% block content %}
  <!-- Render main edit comment section. -->
  <section class="container page-blog-edit-comment">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="comp-card">
          <div class="comp-card__body p-4">
            <!-- Show page title. -->
            <h2 class="comp-card__title mb-4 text-center">
              <i class="fa-solid fa-pen me-2"></i>Edit Comment
            </h2>
            <!-- Render edit comment form. -->
            <form method="post" class="comp-form" novalidate>
              {% csrf_token %}
              {{ form.as_p }}
              <!-- Render form actions. -->
              <div class="d-flex justify-content-between mt-3">
                <!-- Back to previous page. -->
                <a class="btn btn-outline-secondary" href="{{ next_url }}">Cancel</a>
                <!-- Save changes. -->
                <button type="submit" class="comp-button comp-button--outline">
                  <i class="fa-solid fa-save me-2"></i>Save Changes
                </button>
              </div>
            </form>
            <!-- End edit comment form. -->
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- End main edit comment section. -->
{% endblock content %}
