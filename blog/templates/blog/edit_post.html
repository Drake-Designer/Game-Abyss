{% extends "base.html" %}
{% load static %}
{% block title %}
  Edit Post · Game Abyss
{% endblock title %}
{% block content %}
  <!-- PAGE: Blog / Edit post -->
  <section class="container page-blog-edit-post">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="comp-card">
          <div class="comp-card__body p-4">
            <h2 class="comp-card__title mb-4 text-center">
              <i class="fa-solid fa-pen-to-square me-2"></i>Edit Post
            </h2>
            <form method="post"
                  enctype="multipart/form-data"
                  class="comp-form"
                  novalidate>
              {% csrf_token %}
              {{ form.as_p }}
              <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mt-3">
                <a class="btn btn-outline-secondary" href="{{ next_url }}">Cancel</a>
                <div class="d-flex flex-wrap gap-2 justify-content-end">
                  <button type="submit"
                          name="action"
                          value="save_draft"
                          class="comp-button comp-button--outline">
                    <i class="fa-solid fa-save me-2"></i>Save Draft
                  </button>
                  <button type="submit"
                          name="action"
                          value="save"
                          class="comp-button comp-button--outline">
                    <i class="fa-solid fa-pen-to-square me-2"></i>Save Changes
                  </button>
                  <button type="submit"
                          name="action"
                          value="publish"
                          class="comp-button comp-button--primary">
                    <i class="fa-solid fa-rocket me-2"></i>Publish
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- END PAGE: Blog / Edit post -->
{% endblock content %}
